/a><text x="108" y="950.2" fill="#555" font-size="14" font-weight="400" text-anchor="start">Upload shrine photo and select two pieces</text><rect x="88" y="1013.2" width="1264" height="108" rx="12" fill="#eee"/><a href="?screen=comparison-result&amp;device=desktop" data-go="comparison-result"><text x="108" y="1050.2" fill="#222" font-size="22" font-weight="700" text-anchor="start">07 · Decide</text></a><text x="108" y="1080.2" fill="#555" font-size="14" font-weight="400" text-anchor="start">Stronger, close-match or neither-fits result</text><rect x="88" y="1143.2" width="1264" height="108" rx="12" fill="#eee"/><a href="?screen=cart&amp;device=desktop" data-go="cart"><text x="108" y="1180.2" fill="#222" font-size="22" font-weight="700" text-anchor="start">08 · Review</text></a><text x="108" y="1210.2" fill="#555" font-size="14" font-weight="400" text-anchor="start">Quantities, remove pieces and totals</text><rect x="88" y="1273.2" width="1264" height="108" rx="12" fill="#eee"/><a href="?screen=checkout&amp;device=desktop" data-go="checkout"><text x="108" y="1310.2" fill="#222" font-size="22" font-weight="700" text-anchor="start">09 · Request</text></a><text x="108" y="1340.2" fill="#555" font-size="14" font-weight="400" text-anchor="start">Contact, delivery and local request validation</text><rect x="88" y="1403.2" width="1264" height="108" rx="12" fill="#eee"/><a href="?screen=order-success&amp;device=desktop" data-go="order-success"><text x="108" y="1440.2" fill="#222" font-size="22" font-weight="700" text-anchor="start">10 · Saved</text></a><text x="108" y="1470.2" fill="#555" font-size="14" font-weight="400" text-anchor="start">Reference and local request summary</text><rect x="0" y="1587.2" width="1440" height="210" rx="0" fill="#ddd"/><text x="88" y="1632.2" fill="#222" font-size="18" font-weight="700" text-anchor="start">SACRED FORM</text><text x="88" y="1663.2" fill="#555" font-size="14" font-weight="400" text-anchor="start">Objects for stillness.</text><a hr