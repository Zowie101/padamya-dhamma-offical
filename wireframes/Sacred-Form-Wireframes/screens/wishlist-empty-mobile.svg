-size="11" font-weight="700" text-anchor="start">NO PIECES SAVED</text><rect x="22" y="418.7" width="346" height="250" rx="8" fill="#bcbcbc"/><path d="M34 430.7L356 656.7M356 430.7L34 656.7" stroke="#aeaeae"/><text x="195.0" y="549.7" fill="#444" font-size="14" font-weight="400" text-anchor="middle">♡</text><text x="22" y="713.7" fill="#222" font-size="28" font-weight="700" text-anchor="start">Keep a piece close.</text><text x="22" y="752.7" fill="#555" font-size="16" font-weight="400" text-anchor="start">Tap a heart on any piece to find it</text><text x="22" y="777.5" fill="#555" font-size="16" font-weight="400" text-anchor="start">here.</text><a href="?screen=shop&amp;device=mobile" data-go="shop"><rect x="22" y="793.7" width="270" height="48" rx="8" fill="#737373"/><text x="40" y="822.7" fill="#fff" font-size="14" font-weight="700" text-anchor="start">Explore the collection</text><text x="274" y="822.7" fill="#fff" font-size="18" font-weight="400" text-anchor="end">→</text></a><rect x="0" y="912.7" width="390" height="290" rx="0" fill="#ddd"/><text x="22" y="957.7" fill="#222" font-size="18" font-weight="700" text-anchor="start">SACRED FORM</text><text x="22" y="988.7" fill="#555" font-size="14" font-weight="400" text-anchor="start">Objects for stillness.</text><a href="?screen=shop&amp;device=mobile" data-go="shop"><text x="22" y="1032.7" fill="#222" font-size="14" font-weight="400" text-anchor="start">Shop all</text></a><a href="?screen=about&amp;device=mobile" data-go="about"><text x="202" y="1032.7" fill="#222" font-size="14" font-weight="400" text-anchor="start">Our story</text></a><a href="?screen=wishlist&amp;device=mobile" data-go="wishlist"><text x="22" y="1068.7" fill="#222" font-size="14" font-weight="400" text-anchor="start">Wishlist</text></a><a href="?screen=cart&amp;device=mobile" data-go="cart"><text x="202" y="1068.7" fill="#222" font-size="14" font-weight="400" text-anchor="start">Shopping bag</text></a><path d="M22 1138.7h346" stroke="#aaa"/><t