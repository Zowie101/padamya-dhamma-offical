ight="210" rx="0" fill="#ddd"/><text x="88" y="1632.2" fill="#222" font-size="18" font-weight="700" text-anchor="start">SACRED FORM</text><text x="88" y="1663.2" fill="#555" font-size="14" font-weight="400" text-anchor="start">Objects for stillness.</text><a href="?screen=shop&amp;device=desktop" data-go="shop"><text x="700" y="1639.2" fill="#222" font-size="14" font-weight="400" text-anchor="start">Shop all</text></a><a href="?screen=about&amp;device=desktop" data-go="about"><text x="850" y="1639.2" fill="#222" font-size="14" font-weight="400" text-anchor="start">Our story</text></a><a href="?screen=wishlist&amp;device=desktop" data-go="wishlist"><text x="1000" y="1639.2" fill="#222" font-size="14" font-weight="400" text-anchor="start">Wishlist</text></a><a href="?screen=cart&amp;device=desktop" data-go="cart"><text x="1150" y="1639.2" fill="#222" font-size="14" font-weight="400" text-anchor="start">Shopping bag</text></a><path d="M88 1733.2h1264" stroke="#aaa"/><text x="88" y="1767.2" fill="#555" font-size="12" font-weight="400" text-anchor="start">© 2026 Sacred Form · Myanmar</text></svg>