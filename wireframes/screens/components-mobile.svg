;device=mobile" data-go="product"><text x="40" y="1076.8" fill="#222" font-size="20" font-weight="700" text-anchor="start">Golden Presence</text></a><text x="40" y="1103.8" fill="#666" font-size="13" font-weight="400" text-anchor="start">Home Shrine · 28 cm</text><text x="40" y="1130.8" fill="#222" font-size="15" font-weight="400" text-anchor="start">68,000 MMK</text><a href="?screen=cart&amp;device=mobile" data-go="cart"><rect x="40" y="1155.8" width="214" height="44" rx="8" fill="#737373"/><text x="58" y="1182.8" fill="#fff" font-size="14" font-weight="700" text-anchor="start">Add to bag</text><text x="236" y="1182.8" fill="#fff" font-size="18" font-weight="400" text-anchor="end">→</text></a><a href="?screen=compare&amp;device=mobile" data-go="compare"><text x="346" y="1183.8" fill="#222" font-size="13" font-weight="400" text-anchor="end">Compare →</text></a><text x="22" y="1280.8" fill="#555" font-size="16" font-weight="400" text-anchor="start">Interaction notes: heart toggles saved</text><text x="22" y="1305.6" fill="#555" font-size="16" font-weight="400" text-anchor="start">state; quantity updates totals; selected</text><text x="22" y="1330.3999999999999" fill="#555" font-size="16" font-weight="400" text-anchor="start">filters stay dark; carousel changes the</text><text x="22" y="1355.2" fill="#555" font-size="16" font-weight="400" text-anchor="start">current piece; results animate score</text><text x="22" y="1380.0" fill="#555" font-size="16" font-weight="400" text-anchor="start">charts on entry.</text><text x="22" y="1445.8" fill="#555" font-size="16" font-weight="400" text-anchor="start">Mobile: one-column reading order, full-</text><text x="22" y="1470.6" fill="#555" font-size="16" font-weight="400" text-anchor="start">width actions, comfortable tap targets</text><text x="22" y="1495.3999999999999" fill="#555" font-size="16" font-weight="400" text-anchor="start">and natural page scrolling. Desktop:</text><text x="22" y="1520.2" fill="#555" font-size="16" font-weight="400" text-anchor="start">scene and forms share columns without</text><text x="22" y="1545.0" fill="#555" font-size="16" font-weight="400" text-anchor="start">stretching product imagery.</text><rect x="0" y="1609.8" width="390" height="290" rx="0" fill="#ddd"/><text x="22" y="1654.8" fill="#222" font-size="18" font-weight="700" text-anchor="start">SACRED FORM</text><text x="22" y="1685.8" fill="#555" font-size="14" font-weight="400" text-anchor="start">Objects for stillness.</text><a href="?screen=shop&amp;device=mobile" data-go="shop"><text x="22" y="1729.8" fill="#222" font-size="14" font-weight="400" text-anchor="start">Shop all</text></a><a href="?screen=about&amp;device=mobile" data-go="about"><text x="202" y="1729.8" fill="#222" font-size="14" font-weight="400" text-anchor="start">Our story</text></a><a href="?screen=wishlist&amp;device=mobile" data-go="wishlist"><text x="22" y="1765.8" fill="#222" font-size="14" font-weight="400" text-anchor="start">Wishlist</text></a><a href="?screen=cart&amp;device=mobile" data-go="cart"><text x="202" y="1765.8" fill="#222" font-size="14" font-weight="400" text-anchor="start">Shopping bag</text></a><path d="M22 1835.8h346" stroke="#aaa"/><text x="22" y="1869.8" fill="#555" font-size="12" font-weight="400" text-anchor="start">© 2026 Sacred Form · Myanmar</text></svg>