.79999999999995" fill="#222" font-size="12" font-weight="700" text-anchor="start">Required — please complete this field.</text><text x="44" y="431.79999999999995" fill="#222" font-size="14" font-weight="700" text-anchor="start">Phone number</text><rect x="44" y="443.79999999999995" width="302" height="48" rx="6" fill="#f7f7f7" stroke="#555"/><text x="58" y="473.79999999999995" fill="#666" font-size="14" font-weight="400" text-anchor="start">Enter phone number</text><text x="44" y="511.79999999999995" fill="#222" font-size="12" font-weight="700" text-anchor="start">Required — please complete this field.</text><text x="44" y="533.8" fill="#222" font-size="14" font-weight="700" text-anchor="start">Email · optional</text><rect x="44" y="545.8" width="302" height="48" rx="6" fill="#f7f7f7" stroke="#aaa"/><text x="58" y="575.8" fill="#666" font-size="14" font-weight="400" text-anchor="start">Enter email · optional</text><text x="44" y="615.8" fill="#222" font-size="14" font-weight="700" text-anchor="start">Delivery address</text><rect x="44" y="627.8" width="302" height="48" rx="6" fill="#f7f7f7" stroke="#555"/><text x="58" y="657.8" fill="#666" font-size="14" font-weight="400" text-anchor="start">Enter delivery address</text><text x="44" y="695.8" fill="#222" font-size="12" font-weight="700" text-anchor="start">Required — please complete this field.</text><text x="44" y="717.8" fill="#222" font-size="14" font-weight="700" text-anchor="start">City</text><rect x="44" y="729.8" width="302" height="48" rx="6" fill="#f7f7f7" stroke="#555"/><text x="58" y="759.8" fill="#666" font-size="14" font-weight="400" text-anchor="start">Enter city</text><text x="44" y="797.8" fill="#222" font-size="12" font-weight="700" text-anchor="start">Required — please complete this field.</text><text x="44" y="819.8" fill="#222" font-size="14" font-weight="700" text-anchor="start">Country</text><rect x="44" y="831.8" width="302" height="48" rx="6" fill="#f7f7f7" stroke="#aaa"/><text x="58" y="861.8" fill="#666" font-size="14" font-weight="400" text-anchor="start">Myanmar ⌄</text><text x="44" y="901.8" fill="#222" font-size="14" font-weight="700" text-anchor="start">Order note · optional</text><rect x="44" y="913.8" width="302" height="48" rx="6" fill="#f7f7f7" stroke="#aaa"/><text x="58" y="943.8" fill="#666" font-size="14" font-weight="400" text-anchor="start">Enter order note · optional</text><text x="44" y="988.8" fill="#555" font-size="14" font-weight="400" text-anchor="start">Prototype: saves an order request in</text><text x="44" y="1010.5" fill="#555" font-size="14" font-weight="400" text-anchor="start">this browser. No payment is collected or</text><text x="44" y="1032.2" fill="#555" font-size="14" font-weight="400" text-anchor="start">order sent.</text><a href="?screen=order-success&amp;device=mobile" data-go="order-success"><rect x="44" y="1068.8" width="302" height="48" rx="8" fill="#737373"/><text x="62" y="1097.8" fill="#fff" font-size="14" font-weight="700" text-anchor="start">Save order request</text><text x="328" y="1097.8" fill="#fff" font-size="18" font-weight="400" text-anchor="end">→</text></a><rect x="22" y="1273.8" width="346" height="360" rx="12" fill="#bbb"/><text x="44" y="1311.8" fill="#222" font-size="24" font-weight="700" text-anchor="start">Your pieces</text><rect x="44" y="1338.8" width="65" height="68" rx="8" fill="#bcbcbc"/><path d="M56 1350.8L97 1394.8M97 1350.8L56 1394.8" stroke="#aeaeae"/><text x="76.5" y="1378.8" fill="#444" font-size="14" font-weight="400" text-anchor="middle">IMG</text><text x="127" y="1363.8" fill="#222" font-size="14" font-weight="700" text-anchor="start">Golden Presence</text><text x="127" y="1388.8" fill="#222" font-size="13" font-weight="400" text-anchor="start">68,000 MMK</text><rect x="44" y="1423.8" width="65" height="68" rx="8" fill="#bcbcbc"/><path d="M56 1435.8L97 1479.8M97 1435.8L56 1479.8" stroke="#aeaeae"/><text x="76.5" y="1463.8" fill="#444" font-size="14" font-weight="400" text-anchor="middle">IMG</text><text x="127" y="1448.8" fill="#222" font-size="14" font-weight="700" text-anchor="start">Quiet Meditation</text><text x="127" y="1473.8" fill="#222" font-size="13" font-weight="400" text-anchor="start">42,000 MMK</text><path d="M44 1523.8h302" stroke="#aaa"/><text x="44" y="1554.8" fill="#222" font-size="17" font-weight="700" text-anchor="start">Subtotal · 110,000 MMK</text><text x="44" y="1585.8" fill="#555" font-size="13" font-weight="400" text-anchor="start">Delivery confirmed separately.</text><rect x="0" y="1707.8" width="390" height="290" rx="0" fill="#ddd"/><text x="22" y="1752.8" fill="#222" font-size="18" font-weight="700" text-anchor="start">SACRED FORM</text><text x="22" y="1783.8" fill="#555" font-size="14" font-weight="400" text-anchor="start">Objects for stillness.</text><a href="?screen=shop&amp;device=mobile" data-go="shop"><text x="22" y="1827.8" fill="#222" font-size="14" font-weight="400" text-anchor="start">Shop all</text></a><a href="?screen=about&amp;device=mobile" data-go="about"><text x="202" y="1827.8" fill="#222" font-size="14" font-weight="400" text-anchor="start">Our story</text></a><a href="?screen=wishlist&amp;device=mobile" data-go="wishlist"><text x="22" y="1863.8" fill="#222" font-size="14" font-weight="400" text-anchor="start">Wishlist</text></a><a href="?screen=cart&amp;device=mobile" data-go="cart"><text x="202" y="1863.8" fill="#222" font-size="14" font-weight="400" text-anchor="start">Shopping bag</text></a><path d="M22 1933.8h346" stroke="#aaa"/><text x="22" y="1967.8" fill="#555" font-size="12" font-weight="400" text-anchor="start">© 2026 Sacred Form · Myanmar</text></svg>