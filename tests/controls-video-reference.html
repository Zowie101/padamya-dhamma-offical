<!doctype html><meta charset="utf-8"><title>Control transition reference</title><style>body{margin:0;font:12px system-ui}canvas{max-width:100%}</style><p id="status">Reading reference video</p><video id="video" src="../preview/controls-close-reference.mp4" muted playsinline hidden></video><canvas id="frames"></canvas><script>
const v=document.querySelector('video'),c=document.querySelector('canvas'),ctx=c.getContext('2d');v.onloadedmetadata=async()=>{const n=16,w=145,h=Math.round(w*v.videoHeight/v.videoWidth);c.width=w*8;c.height=(h+22)*2;for(let i=0;i<n;i++){const t=Math.min(v.duration-.05,.05+i*v.duration/n);await new Promise(r=>{v.onseeked=r;v.currentTime=t});const x=i%8*w,y=Math.floor(i/8)*(h+22);ctx.drawImage(v,x,y,w,h);ctx.fillText(t.toFixed(2)+' s',x+5,y+h+15)}document.querySelector('#status').textContent='Duration '+v.duration.toFixed(2)+' s · reference frames';};
</script>
