<!doctype html><html><head><meta charset="utf-8"><title>Apple AR asset conversion checks</title><style>body{font:14px system-ui;background:#eee9df;padding:24px;color:#242a22}button{padding:12px}#mount{position:absolute;width:2px;height:2px;overflow:hidden;opacity:.01}model-viewer{width:2px;height:2px}pre{white-space:pre-wrap}</style></head><body><h1>Apple AR file preparation</h1><p>Actual model loading, sizing and USDZ conversion. This does not simulate an iPhone's native AR viewer.</p><button id="start">Prepare all six statues</button><p id="status"></p><pre id="report"></pre><div id="mount"></div><script src="../assets/js/app.js"></script><script type="module">
import {prepareQuickLook} from '../assets/js/room-ios.js?v=20261031-15';
const products=window.SacredForm.products.map(p=>({...p,model:new URL('../'+p.model,location.href).href,arModel:new URL('../'+p.arModel,location.href).href}));let controller;
document.querySelector('#start').onclick=async()=>{document.querySelector('#start').disabled=true;const results=[];for(const product of products){controller=new AbortController();try{const preview=await prepareQuickLook({product,mount:document.querySelector('#mount'),signal:controller.signal,onStatus:s=>document.querySelector('#status').textContent=product.name+' · '+s});const blob=await(await fetch(preview.url)).blob(),header=new Uint8Array(await blob.slice(0,4).arrayBuffer()),height=preview.viewer.getDimensions().y,expected=parseFloat(product.height)/100;results.push({piece:product.name,bytes:blob.size,height,expected,passed:blob.size>10000&&header[0]===80&&header[1]===75&&Math.abs(height-expected)<.003});preview.dispose();controller.abort();}catch(e){results.push({piece:product.name,passed:false,error:e.message});}document.querySelector('#report').textContent=JSON.stringify(results,null,2);}document.querySelector('#report').dataset.passed=String(results.length===6&&results.every(r=>r.passed));document.querySelector('#report').dataset.complete='true';document.querySelector('#status').textContent='Finished · file conversion only, physical iPhone test still required';};addEventListener('pagehide',()=>controller?.abort());
</script></body></html>
